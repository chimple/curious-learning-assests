<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script>
    const storeUrl = new URL('https://play.google.com/store/apps/details?id=org.chimple.bahama');
    storeUrl.searchParams.set('referrer', window.location.href);
    const launchQuery = new URLSearchParams(window.location.search).toString();
    const intentUrl = `intent://respect/launch${launchQuery ? `?${launchQuery}` : ''}` +
      '#Intent;scheme=chimple;category=android.intent.category.BROWSABLE;' +
      'package=org.chimple.bahama;' +
      `S.browser_fallback_url=${encodeURIComponent(storeUrl.href)};end`;

    window.location.replace(intentUrl);
    window.setTimeout(() => window.location.replace(storeUrl.href), 1200);
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Get Chimple</title>
  <style>
    body { align-items: center; background: #f4f7fb; color: #1f2937; display: flex; font-family: Arial, sans-serif; justify-content: center; margin: 0; min-height: 100vh; text-align: center; }
    main { background: #fff; border-radius: 16px; box-shadow: 0 8px 24px #0000001f; margin: 24px; max-width: 360px; padding: 32px 24px; }
    a { background: #1a73e8; border-radius: 8px; color: #fff; display: block; font-weight: 700; margin-top: 24px; padding: 14px; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <h1>Get Chimple</h1>
    <p>Opening Google Play…</p>
    <a href="https://play.google.com/store/apps/details?id=org.chimple.bahama">Download Chimple from Google Play</a>
  </main>
</body>
</html>
